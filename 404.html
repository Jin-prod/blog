<script>
    (() => {
      const root = document.getElementById("nf-cinematic-shell");
      if (!root) return;

      const catStage = root.querySelector(".nf-cat-stage");
      const rightFour = root.querySelector("[data-nf-right]");
      if (!catStage || !rightFour) return;

      const mediaQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      if (mediaQuery.matches) return;

      const punchRightFour = () => {
        catStage.classList.remove("punching");
        rightFour.classList.remove("is-hit");
        void catStage.offsetWidth;

        catStage.classList.add("punching");
        setTimeout(() => {
          rightFour.classList.add("is-hit");
        }, 135);
        setTimeout(() => {
          catStage.classList.remove("punching");
        }, 430);
        setTimeout(() => {
          rightFour.classList.remove("is-hit");
        }, 820);
      };

      setTimeout(() => {
        punchRightFour();
        setInterval(punchRightFour, 2900);
      }, 1200);
    })();
  </script>
